# This is a Databricks asset bundle definition for youtube_DB_assetbundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: youtube_DB_assetbundle
  uuid: cc70b1bf-3fd8-46af-9c76-074a1b9bce02

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  warehouse_id:
    description: warehouse to be used

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-643b0fae-cab7.cloud.databricks.com
    variables:
      catalog: youtube_dev
      schema: dev
      warehouse_id: 25afba2e41cfd434
    presets:
      artifacts_dynamic_version: true
  prod:
    mode: production
    workspace:
      host: https://dbc-643b0fae-cab7.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/paharisagnik607@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/paharisagnik607@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: youtube_prod
      schema: prod
      warehouse_id: 25afba2e41cfd434
    permissions:
      - user_name: paharisagnik607@gmail.com
        level: CAN_MANAGE
